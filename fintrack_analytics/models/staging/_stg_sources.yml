sources:
  - name: raw
    database: fintrack_db
    schema: raw
    description: "Sources brutes de données pour le projet FinTrack"
    tables:
      - name: raw_comptes
        description: "Table Comptes"
        columns:
          - name: id
            description: "Identifiant du compte"
          - name: nom_client
            description: "Nom du client"
          - name: email
            description: "Adresse email du client"
          - name: type_compte
            description: "Type de compte"
          - name: date_ouverture
            description: "Date d'ouverture du compte"
          - name: solde_initial
            description: "Solde initial du compte"
          - name: statut
            description: "Statut du compte"
      - name: raw_categories
        description: "Table Categories"
        columns:
          - name: id
            description: "Identifiant de la catégorie"
          - name: nom
            description: "Nom de la catégorie"
          - name: type
            description: "Type de la catégorie"
          - name: groupe
            description: "Groupe de la catégorie"
      - name: raw_transactions
        description: "Table Transactions"
        columns:
          - name: id
            description: "Identifiant de la transaction"
          - name: compte_id
            description: "Identifiant du compte"
          - name: date_transaction
            description: "Date de la transaction"
          - name: montant
            description: "Montant de la transaction"
          - name: type_operation
            description: "Type d'opération"
          - name: categorie_id
            description: "Identifiant de la catégorie"
          - name: description
            description: "Description de la transaction"
          - name: statut
            description: "Statut de la transaction"

      - name: raw_budgets
        description: "Table Budgets"
        columns:
          - name: id
            description: "Identifiant du budget"
          - name: compte_id
            description: "Identifiant du compte"
          - name: categorie_id
            description: "Identifiant de la catégorie"
          - name: mois
            description: "Mois du budget"
          - name: montant_prevu
            description: "Montant prévu pour le budget" 
      - name: raw_virements
        description: "Virements entre comptes internes FinTrack"
      - name: raw_alertes
        description: "Alertes de dépassement de budget"
  
  - name: snapshots
    database: fintrack_db
    schema: snapshots
    description: "Snapshots pour le projet FinTrack"
    tables:
      - name: snap_comptes
        description: "Snapshot des comptes"
  